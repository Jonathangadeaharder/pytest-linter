# cargo-mutants configuration.
# Note: cargo-mutants >= 0.3 reads this from `.cargo/mutants.toml`; this root
# copy is kept for visibility and older toolchains. The two files must stay
# in sync.
exclude_globs = [
    "lsp-server/**",
    "src/main.rs",
    "src/output/**",
    "benches/**",
    "tests/**",
]
